<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ChronoChef IA — Assistant de Cuisson</title>
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel Standalone for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body {
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    input[type="range"] {
      accent-color: #f97316;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen pb-10">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Générateur de bip sonore Web Audio API (sans fichier externe)
    const playBeep = (freq = 880, duration = 0.4, count = 3) => {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        const ctx = new AudioCtx();
        for (let i = 0; i < count; i++) {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = "sine";
          osc.frequency.setValueAtTime(freq, ctx.currentTime + i * 0.5);
          gain.gain.setValueAtTime(0.3, ctx.currentTime + i * 0.5);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.5 + duration);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(ctx.currentTime + i * 0.5);
          osc.stop(ctx.currentTime + i * 0.5 + duration);
        }
      } catch (e) {
        console.warn("Audio non supporté", e);
      }
    };

    const formatTime = (sec) => {
      const m = Math.floor(sec / 60);
      const s = Math.round(sec % 60);
      return `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
    };

    function App() {
      const [activeTab, setActiveTab] = useState("egg");
      const [apiKey, setApiKey] = useState(() => localStorage.getItem("chronochef_gemini_key") || "");
      const [showApiModal, setShowApiModal] = useState(false);

      const saveApiKey = (val) => {
        setApiKey(val);
        localStorage.setItem("chronochef_gemini_key", val);
      };

      // ========================
      // MODULE 1 : OEUF PARFAIT
      // ========================
      const [eggState, setEggState] = useState("mollet");
      const [eggSize, setEggSize] = useState("M");
      const [eggTemp, setEggTemp] = useState("frigo");
      const [eggCount, setEggCount] = useState(2);
      const [eggTimer, setEggTimer] = useState(null);
      const [eggRunning, setEggRunning] = useState(false);

      const eggBaseTimes = {
        coque: { S: 165, M: 185, L: 205, XL: 225, desc: "Blanc juste pris, jaune liquide chaud", tip: "Plonger dans l'eau frémissante. Écaler le chapeau immédiatement." },
        mollet: { S: 330, M: 365, L: 395, XL: 425, desc: "Blanc ferme, jaune coulant et crémeux", tip: "Plonger dans l'eau bouillante, puis choc thermique dans l'eau glacée 2 min avant d'écaler." },
        confit: { S: 420, M: 455, L: 490, XL: 525, desc: "Blanc ferme, jaune mi-cuit confit (Ramen)", tip: "Idéal pour salade ou plat : ne coule pas partout mais reste fondant." },
        dur: { S: 540, M: 585, L: 630, XL: 675, desc: "Blanc et jaune fermes sans cerne gris", tip: "Eau frémissante, puis refroidir immédiatement à l'eau froide." },
        plat: { S: 180, M: 195, L: 210, XL: 225, desc: "Cuisson poêle feu doux/moyen, jaune brillant", tip: "Beurre moussant, saler uniquement le blanc pour éviter de tacher le jaune." },
        poche: { S: 165, M: 180, L: 200, XL: 220, desc: "Eau frémissante + vinaigre, tourbillon", tip: "Casser l'œuf dans un ramequin avant de le glisser au centre du tourbillon." },
      };

      const computeEggSeconds = () => {
        let base = eggBaseTimes[eggState][eggSize];
        if (eggTemp === "ambiant") base -= 25;
        if (eggCount > 2 && eggState !== "plat") base += (eggCount - 2) * 8;
        return Math.max(90, base);
      };

      const targetEggSec = computeEggSeconds();

      useEffect(() => {
        if (!eggRunning) return;
        const interval = setInterval(() => {
          setEggTimer((prev) => {
            if (prev <= 1) {
              clearInterval(interval);
              setEggRunning(false);
              playBeep(920, 0.4, 4);
              return 0;
            }
            return prev - 1;
          });
        }, 1000);
        return () => clearInterval(interval);
      }, [eggRunning]);

      // =======================================
      // MODULE 2 : COMBO MICRO-ONDES -> FOUR
      // =======================================
      const presetOvenItems = [
        { id: "frites", name: "Frites au four", temp: 180, time: 20, crispy: true, state: "surgele" },
        { id: "colin", name: "Filet de colin", temp: 210, time: 20, crispy: false, state: "surgele" },
        { id: "cabillaud", name: "Dos de cabillaud", temp: 210, time: 28, crispy: false, state: "surgele" },
        { id: "saumon_four", name: "Pavé de saumon", temp: 200, time: 18, crispy: false, state: "frais" },
        { id: "nuggets", name: "Nuggets / Panés", temp: 200, time: 15, crispy: true, state: "surgele" },
        { id: "gratin", name: "Gratin individuel", temp: 190, time: 25, crispy: false, state: "surgele" },
      ];

      const [selectedOvenItems, setSelectedOvenItems] = useState([
        { ...presetOvenItems[0] },
        { ...presetOvenItems[1] },
        { ...presetOvenItems[2] },
      ]);
      const [customOvenName, setCustomOvenName] = useState("");
      const [aiOvenAdvice, setAiOvenAdvice] = useState("");
      const [aiOvenLoading, setAiOvenLoading] = useState(false);

      const togglePresetOven = (preset) => {
        const exists = selectedOvenItems.find((i) => i.id === preset.id);
        if (exists) {
          setSelectedOvenItems(selectedOvenItems.filter((i) => i.id !== preset.id));
        } else {
          setSelectedOvenItems([...selectedOvenItems, { ...preset }]);
        }
      };

      const updateOvenItem = (id, field, value) => {
        setSelectedOvenItems(
          selectedOvenItems.map((item) => (item.id === id ? { ...item, [field]: value } : item))
        );
      };

      const addCustomOvenItem = () => {
        if (!customOvenName.trim()) return;
        const lower = customOvenName.toLowerCase();
        const isCrispy = lower.includes("frite") || lower.includes("pané") || lower.includes("croustill") || lower.includes("pizza") || lower.includes("nugget");
        setSelectedOvenItems([
          ...selectedOvenItems,
          {
            id: "custom_" + Date.now(),
            name: customOvenName.trim(),
            temp: 200,
            time: 22,
            crispy: isCrispy,
            state: "surgele",
          },
        ]);
        setCustomOvenName("");
      };

      const calculateOvenPlan = () => {
        if (selectedOvenItems.length === 0) return null;
        // Compromis de température pondéré
        const avgTemp = selectedOvenItems.reduce((acc, i) => acc + i.temp, 0) / selectedOvenItems.length;
        const targetTemp = Math.round(avgTemp / 5) * 5;

        // Si un aliment croustillant (ex: frites) est présent, il fixe souvent la durée cible au four
        const crispyItems = selectedOvenItems.filter((i) => i.crispy);
        let commonOvenMinutes = 16;

        if (crispyItems.length > 0) {
          // Ajustement thermique de la durée de l'aliment croustillant à la nouvelle température
          const ref = crispyItems[0];
          const tempFactor = ref.temp / targetTemp;
          commonOvenMinutes = Math.round(ref.time * tempFactor);
        } else {
          const minItem = selectedOvenItems.reduce((min, i) => (i.time < min.time ? i : min), selectedOvenItems[0]);
          commonOvenMinutes = Math.max(12, Math.round(minItem.time * (minItem.temp / targetTemp) * 0.8));
        }

        const results = selectedOvenItems.map((item) => {
          // Temps théorique nécessaire au four à targetTemp sans micro-ondes
          const equivalentOvenMin = item.time * (item.temp / targetTemp);
          const deficitMin = equivalentOvenMin - commonOvenMinutes;

          if (item.crispy || deficitMin <= 1.5) {
            return {
              ...item,
              mwSeconds: 0,
              mwNote: item.crispy
                ? "0 min (Interdit : ramollit l'amidon/panure)"
                : "0 min (Directement au four)",
            };
          }

          // 1 min de micro-ondes à 500-600W compense environ 3.2 min de four sur du poisson/plat
          const rawMwSec = Math.round((deficitMin / 3.2) * 60);
          const clampedMwSec = Math.min(300, Math.max(45, Math.round(rawMwSec / 15) * 15));

          return {
            ...item,
            mwSeconds: clampedMwSec,
            mwNote:
              clampedMwSec >= 150
                ? "À 500-600W · Retourner à mi-temps"
                : "À 500-600W · Couvrir d'une cloche",
          };
        });

        // Trier du plus long temps micro-ondes au plus court
        results.sort((a, b) => b.mwSeconds - a.mwSeconds);

        return { targetTemp, commonOvenMinutes, results };
      };

      const ovenPlan = calculateOvenPlan();

      const askGeminiOven = async () => {
        if (!apiKey) {
          setShowApiModal(true);
          return;
        }
        setAiOvenLoading(true);
        setAiOvenAdvice("");
        try {
          const listStr = selectedOvenItems
            .map((i) => `${i.name} (${i.state}, notice: ${i.temp}°C ${i.time}min)`)
            .join(", ");
          const prompt = `Tu es un expert culinaire pragmatique. Je veux cuire simultanément au four à la fin et préchauffer au micro-ondes avant : ${listStr}. Donne-moi en 4 puces ultra-concises (sans intro ni politesse) : 1) Température et durée commune au four, 2) Temps exact au micro-ondes (500-600W) pour chaque aliment avant d'enfourner, 3) L'ordre de passage, 4) Le point de vigilance texture.`;
          const res = await fetch(
            `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`,
            {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] }),
            }
          );
          const data = await res.json();
          const txt = data?.candidates?.[0]?.content?.parts?.[0]?.text || "Erreur de réponse IA. Vérifie ta clé API.";
          setAiOvenAdvice(txt);
        } catch (err) {
          setAiOvenAdvice("Impossible de joindre l'API Gemini. Vérifie ta connexion ou ta clé API.");
        }
        setAiOvenLoading(false);
      };

      // =======================================
      // MODULE 3 : SYNCHRO TOP CHRONO (REPAS)
      // =======================================
      const [pastaMinutes, setPastaMinutes] = useState(9);
      const [syncCombo, setSyncCombo] = useState("combo_saumon_epinards");
      const [mergeMode, setMergeMode] = useState("incorporer");
      const [customSyncIngredients, setCustomSyncIngredients] = useState("");
      const [aiSyncResult, setAiSyncResult] = useState("");
      const [aiSyncLoading, setAiSyncLoading] = useState(false);

      // Chronomètre de synchronisation globale
      const [syncRunning, setSyncRunning] = useState(false);
      const [syncElapsed, setSyncElapsed] = useState(0);

      const buildTimeline = () => {
        const boilTime = 5; // 5 min pour faire bouillir l'eau des pâtes (avec couvercle/bouilloire)
        const totalPastaTrack = boilTime + pastaMinutes;

        let steps = [];

        if (syncCombo === "combo_saumon_epinards") {
          const totalDuration = Math.max(totalPastaTrack, 14);
          steps = [
            {
              atMinFromStart: 0,
              tMinus: totalDuration,
              title: "Lancer l'eau des pâtes + Sortir le saumon du frigo",
              detail: "Mettre une grande casserole d'eau salée à chauffer (couvercle dessus).",
            },
            {
              atMinFromStart: totalDuration - (pastaMinutes + 2),
              tMinus: pastaMinutes + 2,
              title: "Lancer les pâtes aux épinards surgelées (Poêle ou Micro-ondes)",
              detail: "À la poêle à feu doux avec 2 c.à.s d'eau à couvert (ou 4 min au micro-ondes à 600W).",
            },
            {
              atMinFromStart: totalDuration - pastaMinutes,
              tMinus: pastaMinutes,
              title: `Plonger les pâtes sèches (${pastaMinutes} min) + Chauffer la poêle du saumon`,
              detail: "L'eau bout : plonger les pâtes. Préchauffer la poêle du pavé de saumon à feu moyen-vif.",
            },
            {
              atMinFromStart: totalDuration - 8,
              tMinus: 8,
              title: "Saisir le pavé de saumon côté peau (5 min)",
              detail: "Poser côté peau dans la poêle chaude huilée. Ne pas toucher pendant 5 minutes.",
            },
            {
              atMinFromStart: totalDuration - 3,
              tMinus: 3,
              title: "Retourner le saumon (3 min côté chair, feu doux)",
              detail: "Baisser le feu pour garder le cœur nacré et moelleux.",
            },
            {
              atMinFromStart: totalDuration - 1,
              tMinus: 1,
              title:
                mergeMode === "incorporer"
                  ? "Égoutter les pâtes (garder 2 c.à.s d'eau) et fusionner avec les épinards"
                  : "Égoutter les pâtes et dresser à côté des épinards",
              detail: "Mélanger 1 min à feu doux pour lier la sauce aux épinards sur toutes les pâtes.",
            },
            {
              atMinFromStart: totalDuration,
              tMinus: 0,
              title: "Service immédiat : tout est chaud au même instant",
              detail: "Poser le pavé de saumon sur le mélange pâtes / épinards.",
            },
          ];
          return { totalDuration, steps: steps.sort((a, b) => a.atMinFromStart - b.atMinFromStart) };
        }

        if (syncCombo === "combo_eminces_julienne" || syncCombo === "combo_aiguillettes_julienne") {
          const isAiguillettes = syncCombo === "combo_aiguillettes_julienne";
          const chickenLabel = isAiguillettes ? "les aiguillettes de poulet" : "les émincés de poulet";
          const chickenSearMin = isAiguillettes ? 5 : 4;
          const julienneMin = 8;
          const panTrack = chickenSearMin + julienneMin + 2; // Saisie poulet -> retrait -> julienne -> fusion
          const totalDuration = Math.max(totalPastaTrack, panTrack);

          steps = [
            {
              atMinFromStart: 0,
              tMinus: totalDuration,
              title: `Chauffer l'eau des pâtes + Sortir ${chickenLabel} du frigo`,
              detail: "Saler l'eau et couvrir. Couper/préparer le poulet si besoin.",
            },
            {
              atMinFromStart: totalDuration - panTrack,
              tMinus: panTrack,
              title: `Saisir ${chickenLabel} en premier dans la poêle bien chaude (${chickenSearMin} min)`,
              detail: "IMPORTANT : Saisir le poulet AVANT la julienne surgelée pour le dorer sans qu'il bouille dans l'eau des légumes. Réserver dans une assiette.",
            },
            {
              atMinFromStart: totalDuration - pastaMinutes,
              tMinus: pastaMinutes,
              title: `Plonger les pâtes dans l'eau bouillante (${pastaMinutes} min)`,
              detail: "Remuer dès la première minute pour éviter que ça colle.",
            },
            {
              atMinFromStart: totalDuration - (julienneMin + 2),
              tMinus: julienneMin + 2,
              title: `Lancer la julienne de légumes surgelée dans la même poêle (${julienneMin} min)`,
              detail: "Feu moyen-vif à découvert les 4 premières minutes pour évaporer l'eau de décongélation.",
            },
            {
              atMinFromStart: totalDuration - 2,
              tMinus: 2,
              title: `Remettre ${chickenLabel} dans la julienne de légumes`,
              detail: "Le poulet reprend sa chaleur en 2 min avec les légumes sans sécher.",
            },
            {
              atMinFromStart: totalDuration - 1,
              tMinus: 1,
              title:
                mergeMode === "incorporer"
                  ? "Égoutter les pâtes et les verser dans la poêle (Poulet + Julienne)"
                  : "Égoutter les pâtes et servir avec la poêlée Poulet / Julienne",
              detail: "Ajouter un filet d'huile d'olive ou crème/épices et mélanger 1 min sur le feu.",
            },
            {
              atMinFromStart: totalDuration,
              tMinus: 0,
              title: "À table : Pâtes al dente, poulet moelleux et julienne fondante",
              detail: "Tout arrive chaud à la minute près.",
            },
          ];
          return { totalDuration, steps: steps.sort((a, b) => a.atMinFromStart - b.atMinFromStart) };
        }

        return { totalDuration: 15, steps: [] };
      };

      const timeline = buildTimeline();

      useEffect(() => {
        if (!syncRunning) return;
        const interval = setInterval(() => {
          setSyncElapsed((prev) => {
            const next = prev + 1;
            const totalSec = timeline.totalDuration * 60;
            // Vérifier si une étape démarre exactement à cette seconde
            timeline.steps.forEach((st) => {
              if (Math.round(st.atMinFromStart * 60) === next) {
                playBeep(780, 0.3, 2);
              }
            });
            if (next >= totalSec) {
              clearInterval(interval);
              setSyncRunning(false);
              playBeep(980, 0.5, 4);
              return totalSec;
            }
            return next;
          });
        }, 1000);
        return () => clearInterval(interval);
      }, [syncRunning, timeline]);

      const askGeminiSync = async () => {
        if (!apiKey) {
          setShowApiModal(true);
          return;
        }
        if (!customSyncIngredients.trim()) return;
        setAiSyncLoading(true);
        setAiSyncResult("");
        try {
          const prompt = `Tu es un chef expert en ordonnancement de cuisine. Je veux synchroniser ces aliments pour que tout soit prêt et chaud exactement au même moment (T=0) : "${customSyncIngredients}". Mode souhaité : ${mergeMode}. Donne-moi uniquement le rétroplanning chronologique (T - X min -> T = 0) en liste à puces avec du gras sur les temps et les températures/feux. Zéro intro, zéro blabla.`;
          const res = await fetch(
            `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`,
            {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] }),
            }
          );
          const data = await res.json();
          setAiSyncResult(data?.candidates?.[0]?.content?.parts?.[0]?.text || "Erreur IA.");
        } catch (e) {
          setAiSyncResult("Erreur de connexion à l'API Gemini.");
        }
        setAiSyncLoading(false);
      };

      return (
        <div className="max-w-xl mx-auto px-4 pt-4">
          {/* HEADER */}
          <header className="flex items-center justify-between mb-4 pb-3 border-b border-slate-800">
            <div>
              <h1 className="text-xl font-bold tracking-tight text-white flex items-center gap-2">
                <span>⏱️</span> ChronoChef <span className="text-xs bg-orange-500/20 text-orange-400 px-2 py-0.5 rounded-full font-semibold">IA</span>
              </h1>
              <p className="text-xs text-slate-400">Calculateur thermique & synchronisation sans saisie</p>
            </div>
            <button
              onClick={() => setShowApiModal(true)}
              className={`text-xs px-3 py-1.5 rounded-lg border transition ${
                apiKey
                  ? "border-emerald-500/40 bg-emerald-500/10 text-emerald-300"
                  : "border-slate-700 bg-slate-900 text-slate-300 hover:border-orange-500"
              }`}
            >
              {apiKey ? "✓ IA Connectée" : "⚙️ Clé API IA"}
            </button>
          </header>

          {/* MODAL CLE API GEMINI */}
          {showApiModal && (
            <div className="fixed inset-0 bg-black/75 z-50 flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-700 rounded-2xl p-5 max-w-md w-full space-y-4">
                <h2 className="text-base font-bold text-white">Connexion directe à Gemini IA (Optionnel)</h2>
                <p className="text-xs text-slate-300 leading-relaxed">
                  Les 3 outils (Œufs, Micro-ondes/Four et tes 3 combos Pâtes/Saumon/Poulet/Julienne) fonctionnent <strong>100 % hors-ligne sans clé</strong>. Ajoute une clé API Google AI Studio uniquement si tu veux interroger l'IA sur des recettes libres inédites sur GitHub Pages.
                </p>
                <input
                  type="password"
                  placeholder="Coller ta clé API Gemini (AIzaSy...)"
                  value={apiKey}
                  onChange={(e) => saveApiKey(e.target.value)}
                  className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-orange-500"
                />
                <div className="flex justify-end gap-2">
                  <button
                    onClick={() => setShowApiModal(false)}
                    className="bg-orange-500 hover:bg-orange-600 text-white text-xs font-bold px-4 py-2 rounded-xl"
                  >
                    Fermer & Enregistrer
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* NAVIGATION TABS */}
          <div className="grid grid-cols-3 gap-1.5 bg-slate-900 p-1.5 rounded-2xl mb-5 border border-slate-800">
            <button
              onClick={() => setActiveTab("egg")}
              className={`py-2.5 px-2 rounded-xl text-xs font-bold transition ${
                activeTab === "egg" ? "bg-orange-500 text-white shadow" : "text-slate-400 hover:text-white"
              }`}
            >
              🥚 1. Œuf Parfait
            </button>
            <button
              onClick={() => setActiveTab("oven")}
              className={`py-2.5 px-2 rounded-xl text-xs font-bold transition ${
                activeTab === "oven" ? "bg-orange-500 text-white shadow" : "text-slate-400 hover:text-white"
              }`}
            >
              🔥 2. MO ➔ Four
            </button>
            <button
              onClick={() => setActiveTab("sync")}
              className={`py-2.5 px-2 rounded-xl text-xs font-bold transition ${
                activeTab === "sync" ? "bg-orange-500 text-white shadow" : "text-slate-400 hover:text-white"
              }`}
            >
              🍲 3. Top Synchro
            </button>
          </div>

          {/* ========================================================== */}
          {/* ONGLET 1 : OEUF PARFAIT                                     */}
          {/* ========================================================== */}
          {activeTab === "egg" && (
            <div className="space-y-4">
              {/* Choix de l'état (QCM) */}
              <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-3">
                <label className="text-xs font-bold uppercase tracking-wider text-slate-400">
                  1. État de cuisson souhaité
                </label>
                <div className="grid grid-cols-3 gap-2">
                  {[
                    { id: "coque", label: "À la coque", icon: "🥄" },
                    { id: "mollet", label: "Mollet", icon: "🟠" },
                    { id: "confit", label: "Mi-cuit / Ramen", icon: "🍜" },
                    { id: "dur", label: "Dur", icon: "⚪" },
                    { id: "plat", label: "Au plat", icon: "🍳" },
                    { id: "poche", label: "Poché", icon: "💧" },
                  ].map((st) => (
                    <button
                      key={st.id}
                      onClick={() => {
                        setEggState(st.id);
                        setEggRunning(false);
                        setEggTimer(null);
                      }}
                      className={`p-2.5 rounded-xl border text-left transition flex flex-col justify-between ${
                        eggState === st.id
                          ? "border-orange-500 bg-orange-500/15 text-white"
                          : "border-slate-800 bg-slate-950 text-slate-300"
                      }`}
                    >
                      <span className="text-lg">{st.icon}</span>
                      <span className="text-xs font-bold mt-1">{st.label}</span>
                    </button>
                  ))}
                </div>
              </div>

              {/* Calibre & Température (QCM) */}
              <div className="grid grid-cols-2 gap-3">
                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-2">
                  <label className="text-xs font-bold uppercase tracking-wider text-slate-400">2. Calibre</label>
                  <div className="grid grid-cols-4 gap-1.5">
                    {["S", "M", "L", "XL"].map((sz) => (
                      <button
                        key={sz}
                        onClick={() => {
                          setEggSize(sz);
                          setEggRunning(false);
                          setEggTimer(null);
                        }}
                        className={`py-2 rounded-lg text-xs font-bold border ${
                          eggSize === sz
                            ? "border-orange-500 bg-orange-500 text-white"
                            : "border-slate-800 bg-slate-950 text-slate-400"
                        }`}
                      >
                        {sz}
                      </button>
                    ))}
                  </div>
                </div>

                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-2">
                  <label className="text-xs font-bold uppercase tracking-wider text-slate-400">3. Départ</label>
                  <div className="grid grid-cols-2 gap-1.5">
                    {[
                      { id: "frigo", label: "❄️ Frigo (4°)" },
                      { id: "ambiant", label: "🏠 Ambiant" },
                    ].map((tp) => (
                      <button
                        key={tp.id}
                        onClick={() => {
                          setEggTemp(tp.id);
                          setEggRunning(false);
                          setEggTimer(null);
                        }}
                        className={`py-2 px-1 rounded-lg text-xs font-bold border ${
                          eggTemp === tp.id
                            ? "border-orange-500 bg-orange-500 text-white"
                            : "border-slate-800 bg-slate-950 text-slate-400"
                        }`}
                      >
                        {tp.label}
                      </button>
                    ))}
                  </div>
                </div>
              </div>

              {/* Curseur Nombre d'oeufs */}
              <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-2">
                <div className="flex justify-between text-xs font-bold">
                  <span className="text-slate-400 uppercase">4. Nombre d'œufs dans la casserole</span>
                  <span className="text-orange-400">{eggCount} œuf(s)</span>
                </div>
                <input
                  type="range"
                  min="1"
                  max="6"
                  value={eggCount}
                  onChange={(e) => {
                    setEggCount(Number(e.target.value));
                    setEggRunning(false);
                    setEggTimer(null);
                  }}
                  className="w-full"
                />
              </div>

              {/* Résultat & Minuteur */}
              <div className="bg-gradient-to-br from-orange-500/20 to-slate-900 border border-orange-500/40 rounded-2xl p-5 text-center space-y-3">
                <div className="text-xs font-semibold text-orange-300 uppercase tracking-wider">
                  {eggBaseTimes[eggState].desc}
                </div>
                <div className="text-5xl font-black tracking-tight text-white font-mono">
                  {formatTime(eggTimer !== null ? eggTimer : targetEggSec)}
                </div>
                <p className="text-xs text-slate-300">{eggBaseTimes[eggState].tip}</p>
                <div className="flex justify-center gap-3 pt-2">
                  <button
                    onClick={() => {
                      if (eggTimer === null || eggTimer === 0) setEggTimer(targetEggSec);
                      setEggRunning(!eggRunning);
                    }}
                    className="bg-orange-500 hover:bg-orange-600 text-white font-bold text-sm px-6 py-2.5 rounded-xl shadow"
                  >
                    {eggRunning ? "⏸ Pause" : "▶ Démarrer le minuteur"}
                  </button>
                  {eggTimer !== null && (
                    <button
                      onClick={() => {
                        setEggRunning(false);
                        setEggTimer(null);
                      }}
                      className="bg-slate-800 text-slate-300 text-xs font-bold px-4 py-2.5 rounded-xl"
                    >
                      Réinitialiser
                    </button>
                  )}
                </div>
              </div>
            </div>
          )}

          {/* ========================================================== */}
          {/* ONGLET 2 : COMBO MICRO-ONDES -> FOUR                        */}
          {/* ========================================================== */}
          {activeTab === "oven" && (
            <div className="space-y-4">
              {/* Sélection rapide en 1 clic */}
              <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-3">
                <label className="text-xs font-bold uppercase tracking-wider text-slate-400">
                  1. Coche tes aliments à cuire ensemble
                </label>
                <div className="flex flex-wrap gap-2">
                  {presetOvenItems.map((preset) => {
                    const active = selectedOvenItems.some((i) => i.id === preset.id);
                    return (
                      <button
                        key={preset.id}
                        onClick={() => togglePresetOven(preset)}
                        className={`px-3 py-1.5 rounded-xl text-xs font-bold border transition ${
                          active
                            ? "border-orange-500 bg-orange-500/20 text-white"
                            : "border-slate-800 bg-slate-950 text-slate-400"
                        }`}
                      >
                        {active ? "✓ " : "+ "} {preset.name}
                      </button>
                    );
                  })}
                </div>

                {/* Ajout libre */}
                <div className="flex gap-2 pt-2">
                  <input
                    type="text"
                    placeholder="Autre aliment (ex: Pavé de biche, Lasagnes...)"
                    value={customOvenName}
                    onChange={(e) => setCustomOvenName(e.target.value)}
                    className="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-orange-500"
                  />
                  <button
                    onClick={addCustomOvenItem}
                    className="bg-slate-800 hover:bg-slate-700 text-white text-xs font-bold px-3 py-2 rounded-xl"
                  >
                    + Ajouter
                  </button>
                </div>
              </div>

              {/* Curseurs par aliment sélectionné */}
              {selectedOvenItems.length > 0 && (
                <div className="space-y-2.5">
                  <label className="text-xs font-bold uppercase tracking-wider text-slate-400 px-1">
                    2. Ajuste les indications du paquet (Curseurs)
                  </label>
                  {selectedOvenItems.map((item) => (
                    <div key={item.id} className="bg-slate-900 border border-slate-800 rounded-2xl p-3.5 space-y-2.5">
                      <div className="flex items-center justify-between">
                        <span className="text-sm font-bold text-white">{item.name}</span>
                        <div className="flex items-center gap-2">
                          <button
                            onClick={() => updateOvenItem(item.id, "crispy", !item.crispy)}
                            className={`text-[11px] px-2 py-0.5 rounded-md border ${
                              item.crispy
                                ? "border-amber-500/50 bg-amber-500/15 text-amber-300"
                                : "border-slate-700 text-slate-400"
                            }`}
                          >
                            {item.crispy ? "🍟 Doit croustiller (0 MO)" : "💧 Normal (MO OK)"}
                          </button>
                          <button
                            onClick={() =>
                              setSelectedOvenItems(selectedOvenItems.filter((i) => i.id !== item.id))
                            }
                            className="text-slate-500 hover:text-red-400 text-xs px-1"
                          >
                            ✕
                          </button>
                        </div>
                      </div>

                      <div className="grid grid-cols-2 gap-3 text-xs">
                        <div>
                          <div className="flex justify-between text-slate-400 mb-1">
                            <span>Temp. paquet</span>
                            <span className="font-bold text-orange-400">{item.temp} °C</span>
                          </div>
                          <input
                            type="range"
                            min="160"
                            max="230"
                            step="5"
                            value={item.temp}
                            onChange={(e) => updateOvenItem(item.id, "temp", Number(e.target.value))}
                            className="w-full"
                          />
                        </div>
                        <div>
                          <div className="flex justify-between text-slate-400 mb-1">
                            <span>Durée paquet</span>
                            <span className="font-bold text-orange-400">{item.time} min</span>
                          </div>
                          <input
                            type="range"
                            min="8"
                            max="45"
                            step="1"
                            value={item.time}
                            onChange={(e) => updateOvenItem(item.id, "time", Number(e.target.value))}
                            className="w-full"
                          />
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
              )}

              {/* Plan d'action calculé */}
              {ovenPlan && (
                <div className="bg-slate-900 border border-orange-500/40 rounded-2xl p-4 space-y-3">
                  <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                    <div>
                      <div className="text-xs text-orange-400 font-bold uppercase">Réglage Four Commun</div>
                      <div className="text-2xl font-black text-white">
                        {ovenPlan.targetTemp} °C <span className="text-sm font-normal text-slate-400">Chaleur tournante</span>
                      </div>
                    </div>
                    <div className="text-right">
                      <div className="text-xs text-orange-400 font-bold uppercase">Cuisson Finale</div>
                      <div className="text-2xl font-black text-white">{ovenPlan.commonOvenMinutes} min</div>
                    </div>
                  </div>

                  <div className="space-y-2">
                    <div className="text-xs font-bold text-slate-300 uppercase">
                      Ordre de préchauffage au Micro-ondes (500-600 W) :
                    </div>
                    {ovenPlan.results.map((r, idx) => (
                      <div
                        key={r.id}
                        className="flex items-center justify-between bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs"
                      >
                        <div>
                          <span className="font-bold text-white">
                            {idx + 1}. {r.name}
                          </span>
                          <div className="text-[11px] text-slate-400">{r.mwNote}</div>
                        </div>
                        <div
                          className={`font-mono font-bold px-2.5 py-1 rounded-lg ${
                            r.mwSeconds > 0
                              ? "bg-orange-500/20 text-orange-300"
                              : "bg-slate-800 text-slate-400"
                          }`}
                        >
                          {r.mwSeconds > 0 ? formatTime(r.mwSeconds) : "00:00"}
                        </div>
                      </div>
                    ))}
                  </div>

                  <button
                    onClick={askGeminiOven}
                    disabled={aiOvenLoading}
                    className="w-full bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs font-bold py-2.5 rounded-xl text-orange-300 transition"
                  >
                    {aiOvenLoading ? "Analyse thermique Gemini en cours..." : "✨ Affiner avec Gemini IA (Aliment libre / sans notice)"}
                  </button>

                  {aiOvenAdvice && (
                    <div className="bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-slate-200 whitespace-pre-wrap leading-relaxed">
                      {aiOvenAdvice}
                    </div>
                  )}
                </div>
              )}
            </div>
          )}

          {/* ========================================================== */}
          {/* ONGLET 3 : SYNCHRO TOP CHRONO                               */}
          {/* ========================================================== */}
          {activeTab === "sync" && (
            <div className="space-y-4">
              {/* Combos favoris en 1 clic */}
              <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-3">
                <label className="text-xs font-bold uppercase tracking-wider text-slate-400">
                  1. Choisis ton plat à synchroniser (1 clic)
                </label>
                <div className="space-y-2">
                  {[
                    {
                      id: "combo_saumon_epinards",
                      title: "🐟 Pâtes + Pâtes aux épinards (surgelées) + Pavé de saumon (frigo)",
                    },
                    {
                      id: "combo_eminces_julienne",
                      title: "🍗 Pâtes + Émincés de poulet (frigo) + Julienne de légumes (surgelée)",
                    },
                    {
                      id: "combo_aiguillettes_julienne",
                      title: "🍗 Pâtes + Aiguillettes de poulet (frigo) + Julienne de légumes (surgelée)",
                    },
                  ].map((c) => (
                    <button
                      key={c.id}
                      onClick={() => {
                        setSyncCombo(c.id);
                        setSyncRunning(false);
                        setSyncElapsed(0);
                      }}
                      className={`w-full text-left p-3 rounded-xl border text-xs font-bold transition ${
                        syncCombo === c.id
                          ? "border-orange-500 bg-orange-500/15 text-white"
                          : "border-slate-800 bg-slate-950 text-slate-300"
                      }`}
                    >
                      {c.title}
                    </button>
                  ))}
                </div>
              </div>

              {/* Curseur temps des pâtes & Mode d'incorporation */}
              <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-3">
                <div className="flex justify-between text-xs font-bold">
                  <span className="text-slate-400 uppercase">2. Temps paquet des pâtes sèches</span>
                  <span className="text-orange-400">{pastaMinutes} min</span>
                </div>
                <input
                  type="range"
                  min="3"
                  max="14"
                  value={pastaMinutes}
                  onChange={(e) => {
                    setPastaMinutes(Number(e.target.value));
                    setSyncRunning(false);
                    setSyncElapsed(0);
                  }}
                  className="w-full"
                />

                <div className="grid grid-cols-2 gap-2 pt-1">
                  <button
                    onClick={() => setMergeMode("incorporer")}
                    className={`py-2 rounded-xl text-xs font-bold border ${
                      mergeMode === "incorporer"
                        ? "border-orange-500 bg-orange-500 text-white"
                        : "border-slate-800 bg-slate-950 text-slate-400"
                    }`}
                  >
                    🍲 Tout incorporer à la fin
                  </button>
                  <button
                    onClick={() => setMergeMode("separe")}
                    className={`py-2 rounded-xl text-xs font-bold border ${
                      mergeMode === "separe"
                        ? "border-orange-500 bg-orange-500 text-white"
                        : "border-slate-800 bg-slate-950 text-slate-400"
                    }`}
                  >
                    🍽️ Servir séparément
                  </button>
                </div>
              </div>

              {/* Chronomètre & Séquenceur */}
              <div className="bg-slate-900 border border-orange-500/40 rounded-2xl p-4 space-y-4">
                <div className="flex items-center justify-between">
                  <div>
                    <div className="text-xs font-bold text-orange-400 uppercase">Durée totale synchronisation</div>
                    <div className="text-2xl font-black text-white font-mono">
                      {formatTime(timeline.totalDuration * 60 - syncElapsed)}
                    </div>
                  </div>
                  <div className="flex gap-2">
                    <button
                      onClick={() => setSyncRunning(!syncRunning)}
                      className="bg-orange-500 hover:bg-orange-600 text-white text-xs font-bold px-4 py-2.5 rounded-xl"
                    >
                      {syncRunning ? "⏸ Pause" : "▶ Lancer Top Chrono"}
                    </button>
                    {syncElapsed > 0 && (
                      <button
                        onClick={() => {
                          setSyncRunning(false);
                          setSyncElapsed(0);
                        }}
                        className="bg-slate-800 text-slate-300 text-xs font-bold px-3 py-2.5 rounded-xl"
                      >
                        ↺
                      </button>
                    )}
                  </div>
                </div>

                {/* Liste chronologique des étapes */}
                <div className="space-y-2.5">
                  {timeline.steps.map((st, i) => {
                    const stepSec = st.atMinFromStart * 60;
                    const isDone = syncElapsed >= stepSec && syncElapsed > 0;
                    return (
                      <div
                        key={i}
                        className={`p-3 rounded-xl border text-xs transition ${
                          isDone
                            ? "border-emerald-500/40 bg-emerald-500/10 text-emerald-100"
                            : "border-slate-800 bg-slate-950 text-slate-200"
                        }`}
                      >
                        <div className="flex items-center justify-between font-bold mb-1">
                          <span className="text-orange-400 font-mono">
                            Départ +{st.atMinFromStart} min (T - {st.tMinus} min)
                          </span>
                          {isDone && <span className="text-emerald-400">✓ Actif / Fait</span>}
                        </div>
                        <div className="font-bold text-white text-sm">{st.title}</div>
                        <div className="text-slate-400 mt-0.5">{st.detail}</div>
                      </div>
                    );
                  })}
                </div>
              </div>

              {/* Synchronisation libre via Gemini */}
              <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-2.5">
                <label className="text-xs font-bold uppercase tracking-wider text-slate-400">
                  ✨ Autre combinaison libre (Calculée par Gemini IA)
                </label>
                <div className="flex gap-2">
                  <input
                    type="text"
                    placeholder="Ex: Riz basmati 11min + Crevettes surgelées + Brocolis..."
                    value={customSyncIngredients}
                    onChange={(e) => setCustomSyncIngredients(e.target.value)}
                    className="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-orange-500"
                  />
                  <button
                    onClick={askGeminiSync}
                    disabled={aiSyncLoading}
                    className="bg-orange-500 hover:bg-orange-600 text-white text-xs font-bold px-3.5 py-2 rounded-xl"
                  >
                    {aiSyncLoading ? "..." : "Calculer"}
                  </button>
                </div>
                {aiSyncResult && (
                  <div className="bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-slate-200 whitespace-pre-wrap leading-relaxed">
                    {aiSyncResult}
                  </div>
                )}
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
