<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ChronoChef</title>
    <!-- Balises Apple Web App Plein Écran -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#090e1a">
<style>
        :root {
            --bg-dark: #090e1a;
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.78);
            --text-muted: rgba(255, 255, 255, 0.42);
            --accent-blue: #3898ff;
            --accent-green: #34c759;
            --accent-orange: #ff9f0a;
            --accent-red: #ff453a;
            --accent-purple: #bf5af2;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        html, body {
            background-color: #090e1a !important;
            background: #090e1a !important;
            overscroll-behavior-y: none;
        }

        /* Couche bleu nuit sous l'encoche et la barre d'état iOS */
        body::before {
            content: "";
            position: fixed;
            top: -120px;
            left: 0;
            right: 0;
            bottom: -120px;
            background-color: #090e1a;
            z-index: -1;
            pointer-events: none;
        }

        body {
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            /* Marge haute conservée pour que le sélecteur reste bien sous l'encoche */
            padding-top: max(calc(env(safe-area-inset-top, 0px) + 14px), 52px);
            padding-bottom: max(calc(env(safe-area-inset-bottom, 0px) + 24px
</head>
<body>

    <div class="phone-wrapper">
        <!-- Navigation style Apple Segmented Control -->
        <div class="top-bar">
            <div class="picker">
                <button id="tab-btn-sync" class="active" onclick="switchTab('sync')">⏱️ Synchro</button>
                <button id="tab-btn-oven" onclick="switchTab('oven')">🔥 MO➔Four</button>
                <button id="tab-btn-egg" onclick="switchTab('egg')">🥚 Œufs</button>
            </div>
            <button id="api-key-btn" class="key-btn" onclick="toggleModal(true)">⚙️ IA</button>
        </div>

        <!-- ======================================================= -->
        <!-- ONGLET 1 : SYNCHRONISATION PAR INGRÉDIENTS (1 CASSEROLE + 1 POÊLE + MO) -->
        <!-- ======================================================= -->
        <div id="view-sync" class="tab-view" style="display: flex; flex-direction: column; gap: 14px;">

            <!-- CARTE SÉLECTEUR D'INGRÉDIENTS -->
            <div class="card halo-blue">
                <div class="card-header">
                    <div class="card-title">🥗 Ingrédients du repas</div>
                    <span class="card-subtitle" id="sync-count-label">4 sélectionnés</span>
                </div>

                <div class="cat-label">Féculents (1 Casserole)</div>
                <div class="chips-grid" id="chips-starch"></div>

                <!-- Curseur cranté durée Féculent -->
                <div class="slider-block" style="margin-top: 10px;">
                    <div style="display:flex; justify-content:space-between; font-size:13px;">
                        <span style="color:var(--text-secondary);">Cuisson eau bouillante</span>
                        <span id="starch-time-val" style="font-weight:600; color:#fff;">8 min</span>
                    </div>
                    <div class="slider-wrapper">
                        <input type="range" id="starch-slider" class="custom-slider" min="3" max="15" step="1" value="8">
                        <div class="slider-ticks" id="starch-ticks"></div>
                    </div>
                </div>

                <div class="cat-label">Protéines (Micro-ondes ou Poêle)</div>
                <div class="chips-grid" id="chips-protein"></div>

                <div class="cat-label">Légumes & Garnitures (1 Poêle)</div>
                <div class="chips-grid" id="chips-veg"></div>

                <div class="cat-label">Liants & Sauces</div>
                <div class="chips-grid" id="chips-sauce"></div>

                <!-- Zone d'ajout d'un nouvel aliment -->
                <div class="add-row">
                    <input type="text" id="new-ing-input" class="ios-input" placeholder="Nouvel aliment (ex: Brocolis, Cabillaud...)">
                    <button class="ios-btn-small" onclick="addCustomIngredient()">+ Ajouter</button>
                </div>

                <!-- Alertes d'arbitrage culinaire automatiques -->
                <div id="culinary-alerts"></div>
            </div>

            <!-- CARTE RÉGLAGE MICRO-ONDES (S'affiche si le Saumon est sélectionné) -->
            <div class="card halo-teal" id="salmon-mw-card">
                <div class="card-header">
                    <div class="card-title">📡 Saumon Vapeur Micro-ondes</div>
                    <span class="badge-green">Préserve les Oméga-3</span>
                </div>
                <div style="font-size: 12px; color: var(--text-secondary); line-height: 1.4;">
                    Libère ton unique poêle pour la julienne et la crème. Pour <strong>250 g en 2 morceaux</strong> : place le grand (150 g) vers l'extérieur et le petit (100 g enfant) au centre + <strong>1 c.à.s d'eau sous cloche</strong>.
                </div>
                <div class="mw-power-grid">
                    <div class="mw-pill" onclick="selectMwPower(300)" id="mw-300">300 W<br><span style="font-size:10px; font-weight:400;">Décong.</span></div>
                    <div class="mw-pill active" onclick="selectMwPower(600)" id="mw-600">600 W<br><span style="font-size:10px; font-weight:400;">2m30 · Idéal</span></div>
                    <div class="mw-pill" onclick="selectMwPower(900)" id="mw-900">900 W<br><span style="font-size:10px; font-weight:400;">1m30 · Vif</span></div>
                    <div class="mw-pill" onclick="selectMwPower(1200)" id="mw-1200">1200 W<br><span style="font-size:10px; font-weight:400;">1m00 · Max</span></div>
                </div>
                <div class="portion-bar">
                    <span>👦 Enfant (9 ans) : <strong>90-100 g</strong></span>
                    <span>🧑 Adulte : <strong>150 g</strong></span>
                </div>
            </div>

            <!-- CARTE CHRONOMÈTRE & SYNCHRONISATION -->
            <div class="card halo-emerald">
                <div class="card-header">
                    <div class="card-title">⏱️ Plan de Synchronisation</div>
                    <span class="card-subtitle" id="sync-total-badge">14 min chrono</span>
                </div>

                <div class="big-number-wrap">
                    <div class="big-number" id="sync-timer-display">14:00</div>
                </div>

                <div style="display: flex; gap: 8px; margin-bottom: 12px;">
                    <button class="primary-btn" id="sync-start-btn" onclick="toggleSyncTimer()">▶ Lancer Top Chrono</button>
                    <button class="secondary-btn" onclick="resetSyncTimer()">↺</button>
                </div>

                <div class="timeline-list" id="sync-timeline"></div>

                <!-- Bouton IA si aliments personnalisés complexes -->
                <div style="margin-top: 12px; padding-top: 10px; border-top: 1px solid rgba(255,255,255,0.08);">
                    <button class="secondary-btn" style="width:100%;" onclick="askGeminiCustomSync()" id="ai-sync-btn">
                        ✨ Adapter avec Gemini IA (Ingrédients libres)
                    </button>
                    <div id="ai-sync-output" class="advice-box hidden" style="margin-top:8px; color:#fff; border-color:rgba(56,152,255,0.4); background:rgba(56,152,255,0.12); white-space:pre-wrap;"></div>
                </div>
            </div>
        </div>

        <!-- ======================================================= -->
        <!-- ONGLET 2 : COMBO MICRO-ONDES -> FOUR                     -->
        <!-- ======================================================= -->
        <div id="view-oven" class="tab-view hidden" style="display: flex; flex-direction: column; gap: 14px;">
            <div class="card halo-amber">
                <div class="card-header">
                    <div class="card-title">🔥 Aliments à enfourner ensemble</div>
                    <span class="card-subtitle">Préchauffage MO 600 W</span>
                </div>

                <div class="chips-grid" id="oven-chips"></div>

                <div class="add-row">
                    <input type="text" id="oven-new-input" class="ios-input" placeholder="Autre (ex: Lasagnes, Pavé cabillaud...)">
                    <button class="ios-btn-small" onclick="addOvenCustom()">+ Ajouter</button>
                </div>
            </div>

            <!-- Liste des curseurs par aliment sélectionné -->
            <div id="oven-sliders-container" style="display: flex; flex-direction: column; gap: 12px;"></div>

            <!-- Résultat Four + Micro-ondes 600W -->
            <div class="card halo-emerald" id="oven-result-card">
                <div class="card-header">
                    <div class="card-title">🎯 Réglage Commun</div>
                    <span class="badge-green">Micro-ondes 600 W</span>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; text-align: center; padding: 8px 0 14px 0; border-bottom: 1px solid rgba(255,255,255,0.1);">
                    <div>
                        <div style="font-size: 11px; color: var(--text-muted); text-transform: uppercase;">Four Chaleur Tournante</div>
                        <div class="big-number" id="oven-target-temp" style="font-size: 42px; margin-top: 4px;">200°C</div>
                    </div>
                    <div>
                        <div style="font-size: 11px; color: var(--text-muted); text-transform: uppercase;">Durée Commune</div>
                        <div class="big-number" id="oven-target-time" style="font-size: 42px; margin-top: 4px;">16 min</div>
                    </div>
                </div>

                <div class="timeline-list" id="oven-steps-list" style="margin-top: 12px;"></div>
            </div>
        </div>

        <!-- ======================================================= -->
        <!-- ONGLET 3 : OEUF PARFAIT                                  -->
        <!-- ======================================================= -->
        <div id="view-egg" class="tab-view hidden" style="display: flex; flex-direction: column; gap: 14px;">
            <div class="card halo-amber">
                <div class="card-header">
                    <div class="card-title">🥚 Texture & Calibre</div>
                    <span class="card-subtitle" id="egg-temp-label">Départ Frigo (4°C)</span>
                </div>

                <div class="chips-grid" id="egg-state-chips"></div>

                <div style="display: grid; grid-template-columns: 1.2fr 1fr; gap: 10px; margin-top: 14px;">
                    <div class="picker" style="width: 100%; grid-template-columns: repeat(4, 1fr);">
                        <button onclick="setEggSize('S')" id="egg-sz-S">S</button>
                        <button onclick="setEggSize('M')" id="egg-sz-M" class="active">M</button>
                        <button onclick="setEggSize('L')" id="egg-sz-L">L</button>
                        <button onclick="setEggSize('XL')" id="egg-sz-XL">XL</button>
                    </div>
                    <div class="picker" style="width: 100%; grid-template-columns: 1fr 1fr;">
                        <button onclick="setEggOrigin('frigo')" id="egg-orig-frigo" class="active">❄️ Frigo</button>
                        <button onclick="setEggOrigin('ambiant')" id="egg-orig-ambiant">🏠 Amb.</button>
                    </div>
                </div>

                <div class="slider-block" style="margin-top: 14px;">
                    <div style="display:flex; justify-content:space-between; font-size:13px;">
                        <span style="color:var(--text-secondary);">Nombre d'œufs</span>
                        <span id="egg-count-val" style="font-weight:600;">2 œufs</span>
                    </div>
                    <div class="slider-wrapper">
                        <input type="range" id="egg-count-slider" class="custom-slider" min="1" max="6" step="1" value="2">
                    </div>
                </div>
            </div>

            <div class="card halo-emerald" style="text-align: center;">
                <div class="card-header">
                    <div class="card-title" id="egg-result-title">Œuf Mollet</div>
                    <span class="badge-green">Précision Seconde</span>
                </div>
                <div class="big-number-wrap">
                    <div class="big-number" id="egg-timer-display">06:05</div>
                </div>
                <div id="egg-tip-text" style="font-size: 13px; color: var(--text-secondary); margin-bottom: 14px;">
                    Plonger dans l'eau bouillante, puis choc thermique dans l'eau glacée 2 min.
                </div>
                <div style="display: flex; gap: 8px;">
                    <button class="primary-btn" id="egg-start-btn" onclick="toggleEggTimer()">▶ Démarrer Minuteur</button>
                    <button class="secondary-btn" onclick="resetEggTimer()">↺</button>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL CLÉ API GEMINI -->
    <div class="modal-backdrop" id="api-modal">
        <div class="card halo-blue" style="max-width: 380px; width: 100%;">
            <div class="card-header">
                <div class="card-title">🔑 Clé API Gemini (Optionnel)</div>
            </div>
            <p style="font-size: 12px; color: var(--text-secondary); line-height: 1.45; margin-bottom: 12px;">
                Tous tes ingrédients, le saumon au micro-ondes (300/600/900/1200 W) et le four fonctionnent <strong>100 % hors-ligne sans clé</strong>. Ajoute ta clé uniquement pour analyser des ingrédients inédits via Gemini.
            </p>
            <input type="password" id="api-key-input" class="ios-input" style="width: 100%; margin-bottom: 12px;" placeholder="AIzaSy...">
            <div style="display: flex; justify-content: flex-end; gap: 8px;">
                <button class="secondary-btn" onclick="toggleModal(false)">Fermer</button>
                <button class="primary-btn" style="width: auto; padding: 10px 18px;" onclick="saveApiKey()">Enregistrer</button>
            </div>
        </div>
    </div>

    <script>
        // =========================================================
        // AUDIO BIP (Web Audio API natif iOS)
        // =========================================================
        function playChime(freq = 880, count = 3) {
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                const ctx = new AudioCtx();
                for (let i = 0; i < count; i++) {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = "sine";
                    osc.frequency.setValueAtTime(freq, ctx.currentTime + i * 0.42);
                    gain.gain.setValueAtTime(0.28, ctx.currentTime + i * 0.42);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.42 + 0.35);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(ctx.currentTime + i * 0.42);
                    osc.stop(ctx.currentTime + i * 0.42 + 0.35);
                }
            } catch (e) {}
        }

        function formatMMSS(totalSec) {
            const s = Math.max(0, Math.round(totalSec));
            const m = Math.floor(s / 60);
            const rem = s % 60;
            return `${String(m).padStart(2, '0')}:${String(rem).padStart(2, '0')}`;
        }

        function updateRangeFill(sliderEl) {
            const min = parseFloat(sliderEl.min);
            const max = parseFloat(sliderEl.max);
            const val = parseFloat(sliderEl.value);
            const pct = ((val - min) / (max - min)) * 100;
            sliderEl.style.background = `linear-gradient(to right, #3898ff 0%, #3898ff ${pct}%, rgba(255, 255, 255, 0.16) ${pct}%, rgba(255, 255, 255, 0.16) 100%)`;
        }

        // =========================================================
        // NAVIGATION ENTRE LES 3 ONGLETS
        // =========================================================
        function switchTab(tab) {
            ['sync', 'oven', 'egg'].forEach(t => {
                document.getElementById(`view-${t}`).classList.toggle('hidden', t !== tab);
                document.getElementById(`tab-btn-${t}`).classList.toggle('active', t === tab);
            });
        }

        // =========================================================
        // GESTION CLÉ API GEMINI (localStorage)
        // =========================================================
        let geminiKey = localStorage.getItem('chronochef_gemini_key') || '';
        function refreshKeyStatus() {
            const btn = document.getElementById('api-key-btn');
            btn.classList.toggle('connected', Boolean(geminiKey));
            btn.textContent = geminiKey ? '✓ IA' : '⚙️ IA';
            document.getElementById('api-key-input').value = geminiKey;
        }
        function toggleModal(open) {
            document.getElementById('api-modal').classList.toggle('open', open);
        }
        function saveApiKey() {
            geminiKey = document.getElementById('api-key-input').value.trim();
            localStorage.setItem('chronochef_gemini_key', geminiKey);
            refreshKeyStatus();
            toggleModal(false);
        }

        // =========================================================
        // ONGLET 1 : SYNCHRONISATION PAR INGRÉDIENTS
        // =========================================================
        const defaultIngredients = [
            // Féculents
            { id: 'coquillettes', label: 'Coquillettes', cat: 'starch', defaultMin: 8 },
            { id: 'pates', label: 'Pâtes', cat: 'starch', defaultMin: 9 },
            { id: 'riz', label: 'Riz', cat: 'starch', defaultMin: 11 },
            // Protéines
            { id: 'saumon', label: 'Pavé saumon', cat: 'protein' },
            { id: 'eminces', label: 'Émincés poulet', cat: 'protein' },
            { id: 'aiguillettes', label: 'Aiguillettes', cat: 'protein' },
            { id: 'oeuf_plat', label: 'Œuf poêle', cat: 'protein' },
            // Légumes
            { id: 'julienne', label: 'Julienne surg.', cat: 'veg' },
            { id: 'champignons', label: 'Champignons', cat: 'veg' },
            { id: 'epinards', label: 'Épinards surg.', cat: 'veg' },
            { id: 'courgette', label: 'Courgette', cat: 'veg' },
            // Sauces & Liants
            { id: 'creme', label: 'Crème liquide', cat: 'sauce' },
            { id: 'tomate', label: 'Sauce tomate', cat: 'sauce' }
        ];

        let customIngs = JSON.parse(localStorage.getItem('chronochef_custom_ings') || '[]');
        // Sélection par défaut correspondant à la recette validée (Coquillettes + Saumon + Julienne Picard + Champignons + Crème)
        let selectedSyncIds = ['coquillettes', 'saumon', 'julienne', 'champignons', 'creme'];
        let starchMinutes = 8;
        let mwPower = 600; // 300, 600, 900, 1200

        function getAllIngredients() {
            return [...defaultIngredients, ...customIngs];
        }

        function renderSyncChips() {
            const cats = { starch: 'chips-starch', protein: 'chips-protein', veg: 'chips-veg', sauce: 'chips-sauce' };
            Object.values(cats).forEach(id => document.getElementById(id).innerHTML = '');

            getAllIngredients().forEach(item => {
                const container = document.getElementById(cats[item.cat] || 'chips-veg');
                const btn = document.createElement('button');
                const isSel = selectedSyncIds.includes(item.id);
                btn.className = `chip ${isSel ? 'selected' : ''}`;
                btn.textContent = item.label;
                btn.onclick = () => toggleSyncIng(item);
                container.appendChild(btn);
            });

            document.getElementById('sync-count-label').textContent = `${selectedSyncIds.length} sélectionné(s)`;
            document.getElementById('salmon-mw-card').classList.toggle('hidden', !selectedSyncIds.includes('saumon'));
        }

        function toggleSyncIng(item) {
            const idx = selectedSyncIds.indexOf(item.id);
            if (idx >= 0) {
                selectedSyncIds.splice(idx, 1);
            } else {
                selectedSyncIds.push(item.id);
                if (item.cat === 'starch' && item.defaultMin) {
                    starchMinutes = item.defaultMin;
                    const slider = document.getElementById('starch-slider');
                    slider.value = starchMinutes;
                    document.getElementById('starch-time-val').textContent = `${starchMinutes} min`;
                    updateRangeFill(slider);
                }
            }
            if (navigator.vibrate) navigator.vibrate(5);
            resetSyncTimer();
            renderSyncChips();
            buildSyncPlan();
        }

        function addCustomIngredient() {
            const input = document.getElementById('new-ing-input');
            const name = input.value.trim();
            if (!name) return;
            const newItem = {
                id: 'cust_' + Date.now(),
                label: name.length > 18 ? name.substring(0, 18) + '…' : name,
                cat: 'veg'
            };
            customIngs.push(newItem);
            localStorage.setItem('chronochef_custom_ings', JSON.stringify(customIngs));
            selectedSyncIds.push(newItem.id);
            input.value = '';
            renderSyncChips();
            buildSyncPlan();
        }

        function selectMwPower(w) {
            mwPower = w;
            [300, 600, 900, 1200].forEach(p => {
                document.getElementById(`mw-${p}`).classList.toggle('active', p === w);
            });
            if (navigator.vibrate) navigator.vibrate(5);
            resetSyncTimer();
            buildSyncPlan();
        }

        // Calcul intelligent de la chronologie (1 Casserole + 1 Poêle + Micro-ondes)
        let currentTimeline = { totalMin: 15, steps: [] };

        function buildSyncPlan() {
            const has = (id) => selectedSyncIds.includes(id);
            const alertsEl = document.getElementById('culinary-alerts');
            const alerts = [];

            // Règles d'arbitrage issues des échanges
            const starches = ['coquillettes', 'pates', 'riz'].filter(has);
            if (starches.length > 1) {
                alerts.push("💡 <strong>Doublon féculents :</strong> Garde uniquement les coquillettes ou pâtes (elles accrochent mieux la sauce crémeuse que le riz).");
            }
            if (has('saumon') && has('creme') && has('tomate')) {
                alerts.push("💡 <strong>Accord sauce :</strong> Écarte la sauce tomate (son acidité écrase le saumon et tranche avec la crème liquide).");
            }
            if (has('julienne') && has('courgette')) {
                alerts.push("💡 <strong>Gain de temps :</strong> La julienne surgelée seule couvre 100 % des fibres. Écarte la courgette pour éviter la découpe et l'excès d'eau dans la sauce.");
            }

            alertsEl.innerHTML = alerts.map(a => `<div class="advice-box">${a}</div>`).join('');

            // Paramètres de cuisson
            const boilWaterMin = 5;
            const hasStarch = starches.length > 0;
            const starchName = has('coquillettes') ? 'les coquillettes' : (has('riz') ? 'le riz' : 'les pâtes');

            const hasChicken = has('eminces') || has('aiguillettes');
            const chickenName = has('aiguillettes') ? 'les aiguillettes de poulet' : 'les émincés de poulet';
            const chickenMin = has('aiguillettes') ? 5 : 4;

            const hasJulienne = has('julienne');
            const hasMushrooms = has('champignons');
            const hasSpinach = has('epinards');
            const hasCream = has('creme');
            const hasTomato = has('tomate') && !hasCream;
            const hasSalmon = has('saumon');

            // Durée Micro-ondes Saumon (250g en 2 morceaux) + 1m30 de repos obligatoire
            const mwConfig = {
                300: { cookSec: 240, restSec: 90, label: "4 min à 300 W + 1 min 30 de repos" },
                600: { cookSec: 150, restSec: 90, label: "2 min 30 à 600 W + 1 min 30 de repos" },
                900: { cookSec: 90,  restSec: 90, label: "1 min 30 à 900 W + 1 min 30 de repos" },
                1200:{ cookSec: 60,  restSec: 90, label: "1 min 00 à 1200 W + 1 min 30 de repos" }
            }[mwPower];

            const salmonTotalMin = Math.round(((mwConfig.cookSec + mwConfig.restSec) / 60) * 2) / 2; // ex: 4 min à 600W, 3 min à 900W

            // Durée de la piste Poêle
            let panMin = 0;
            if (hasJulienne || hasMushrooms || has('courgette')) panMin = 9;
            else if (hasSpinach) panMin = 6;
            if (hasChicken) panMin += chickenMin + 1;

            const casseroleTotalMin = hasStarch ? (boilWaterMin + starchMinutes) : 0;
            const totalMin = Math.max(casseroleTotalMin, panMin, hasSalmon ? salmonTotalMin + 2 : 8, 10);

            const steps = [];

            // T = 0 : Mise en place
            const prepTasks = [];
            if (hasStarch) prepTasks.push("Mets un grand volume d'eau salée à bouillir à couvert");
            if (hasMushrooms) prepTasks.push("émince les champignons (2 min)");
            if (hasSalmon) prepTasks.push("place les 2 pavés (150 g extérieur + 100 g centre) dans une assiette creuse avec 1 c.à.s d'eau sous cloche");

            steps.push({
                atMin: 0,
                ustensils: ['Préparation'],
                title: "Mise en place & Chauffe de l'eau",
                desc: prepTasks.length ? prepTasks.join(", ") + "." : "Prépare tes ingrédients sur le plan de travail."
            });

            // Saisie du poulet en premier dans la poêle (si poulet sélectionné)
            if (hasChicken) {
                const startChicken = Math.max(1, totalMin - panMin);
                steps.push({
                    atMin: startChicken,
                    ustensils: ['Poêle unique'],
                    title: `Saisir ${chickenName} en premier (${chickenMin} min)`,
                    desc: "Dore le poulet à feu vif dans la poêle chaude avant les légumes surgelés (sinon il bouillira dans leur eau). Réserve-le dans une assiette."
                });
            }

            // Plonger les féculents dans la casserole
            if (hasStarch) {
                const startStarch = Math.max(1, totalMin - starchMinutes - 1);
                steps.push({
                    atMin: startStarch,
                    ustensils: ['Casserole'],
                    title: `L'eau bout : plonger ${starchName} (${starchMinutes} min)`,
                    desc: "Cuisson seule dans l'eau bouillante (ne jamais y jeter la julienne surgelée pour ne pas casser l'ébullition)."
                });
            }

            // Cuisson des légumes (Julienne Picard / Champignons / Épinards) dans la poêle
            if (hasJulienne || hasMushrooms || hasSpinach || has('courgette')) {
                const vegMin = (hasJulienne || hasMushrooms) ? 9 : 6;
                const startVeg = Math.max(1, totalMin - vegMin - 1);
                const vegNames = [
                    hasJulienne ? 'la julienne surgelée' : null,
                    hasMushrooms ? 'les champignons' : null,
                    hasSpinach ? 'les épinards surgelés' : null,
                    has('courgette') && !hasJulienne ? 'la courgette en petits dés' : null
                ].filter(Boolean).join(' + ');

                steps.push({
                    atMin: startVeg,
                    ustensils: ['Poêle unique'],
                    title: `Lancer ${vegNames} à feu moyen-vif`,
                    desc: hasJulienne
                        ? "IMPORTANT : Cuire sans couvercle les 5 premières minutes en remuant pour évaporer totalement l'eau de congélation."
                        : "Fais revenir à feu moyen avec un filet d'huile d'olive."
                });
            }

            // Lancement du Saumon au Micro-ondes
            if (hasSalmon) {
                const startSalmon = Math.max(1, totalMin - salmonTotalMin - 0.5);
                steps.push({
                    atMin: startSalmon,
                    ustensils: [`Micro-ondes ${mwPower}W`],
                    title: `Lancer le saumon sous cloche (${mwConfig.label})`,
                    desc: `Puissance réglée sur ${mwPower} W. Laisse impérativement reposer 1 min 30 porte fermée après la sonnerie : la vapeur finit de cuire le cœur sans dessécher.`
                });
            }

            // Ajout Crème liquide / Sauce et retour du poulet à T - 3 min
            if (hasCream || hasTomato || hasChicken) {
                const sauceTime = Math.max(1, totalMin - 3);
                const actions = [];
                if (hasChicken) actions.push(`remets ${chickenName} dans la poêle`);
                if (hasCream) actions.push("baisse à feu doux et verse la crème liquide (3-4 c.à.s), sale, poivre et laisse réduire 2 min");
                else if (hasTomato) actions.push("verse la sauce tomate et laisse mijoter 2 min à feu doux");

                steps.push({
                    atMin: sauceTime,
                    ustensils: ['Poêle unique'],
                    title: "Liaison de la sauce à feu doux (2 min)",
                    desc: actions.join(", puis ") + "."
                });
            }

            // Égouttage à T - 1 min
            if (hasStarch) {
                steps.push({
                    atMin: Math.max(1, totalMin - 1),
                    ustensils: ['Casserole'],
                    title: `Égoutter ${starchName} et couper les feux`,
                    desc: "Ajoute une noisette de beurre ou 1 c.à.c d'huile d'olive pour éviter que les pâtes ne collent."
                });
            }

            // T = Total : Dressage
            steps.push({
                atMin: totalMin,
                ustensils: ['À table'],
                title: "Dressage (Adulte & Enfant séparé)",
                desc: "Pour ta fille : sers les coquillettes nappées d'un peu de crème d'un côté, les légumes de l'autre et le saumon effeuillé sans peau à part."
            });

            steps.sort((a, b) => a.atMin - b.atMin);
            currentTimeline = { totalMin, steps };
            renderSyncTimeline();
        }

        let syncRunning = false;
        let syncElapsedSec = 0;
        let syncInterval = null;

        function renderSyncTimeline() {
            document.getElementById('sync-total-badge').textContent = `${currentTimeline.totalMin} min chrono`;
            const remaining = Math.max(0, currentTimeline.totalMin * 60 - syncElapsedSec);
            document.getElementById('sync-timer-display').textContent = formatMMSS(remaining);

            const listEl = document.getElementById('sync-timeline');
            listEl.innerHTML = currentTimeline.steps.map(st => {
                const stepSec = Math.round(st.atMin * 60);
                const isDone = syncElapsedSec > 0 && syncElapsedSec >= stepSec;
                const tMinus = Math.max(0, Math.round((currentTimeline.totalMin - st.atMin) * 10) / 10);
                const minLabel = st.atMin % 1 === 0 ? `${st.atMin} min` : `${Math.floor(st.atMin)} min 30`;
                return `
                    <div class="step-card ${isDone ? 'done' : ''}">
                        <div class="step-top">
                            <span class="step-time">T + ${minLabel} (Reste ${tMinus} min)</span>
                            <div class="step-badges">
                                ${st.ustensils.map(u => `<span class="ustensil-badge">${u}</span>`).join('')}
                            </div>
                        </div>
                        <div class="step-title">${st.title}</div>
                        <div class="step-desc">${st.desc}</div>
                    </div>
                `;
            }).join('');
        }

        function toggleSyncTimer() {
            const btn = document.getElementById('sync-start-btn');
            if (syncRunning) {
                clearInterval(syncInterval);
                syncRunning = false;
                btn.textContent = "▶ Reprendre";
            } else {
                syncRunning = true;
                btn.textContent = "⏸ Pause";
                syncInterval = setInterval(() => {
                    syncElapsedSec++;
                    currentTimeline.steps.forEach(st => {
                        if (Math.round(st.atMin * 60) === syncElapsedSec) playChime(840, 2);
                    });
                    if (syncElapsedSec >= currentTimeline.totalMin * 60) {
                        clearInterval(syncInterval);
                        syncRunning = false;
                        btn.textContent = "✓ Terminé";
                        playChime(980, 4);
                    }
                    renderSyncTimeline();
                }, 1000);
            }
        }

        function resetSyncTimer() {
            clearInterval(syncInterval);
            syncRunning = false;
            syncElapsedSec = 0;
            document.getElementById('sync-start-btn').textContent = "▶ Lancer Top Chrono";
            renderSyncTimeline();
        }

        async function askGeminiCustomSync() {
            if (!geminiKey) {
                toggleModal(true);
                return;
            }
            const out = document.getElementById('ai-sync-output');
            const btn = document.getElementById('ai-sync-btn');
            const names = getAllIngredients().filter(i => selectedSyncIds.includes(i.id)).map(i => i.label).join(', ');
            out.classList.remove('hidden');
            out.textContent = "Calcul de synchronisation Gemini en cours...";
            btn.disabled = true;
            try {
                const prompt = `Je cuisine avec 1 seule casserole, 1 seule poêle et 1 micro-ondes (paliers 300W, 600W, 900W, 1200W). Ingrédients sélectionnés : ${names} (féculent : ${starchMinutes} min). Ne mets jamais de surgelé dans l'eau des pâtes. Donne un rétroplanning ultra-court étape par étape sans intro.`;
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${geminiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });
                const data = await res.json();
                out.textContent = data?.candidates?.[0]?.content?.parts?.[0]?.text || "Réponse indisponible.";
            } catch (e) {
                out.textContent = "Erreur réseau ou clé API invalide.";
            }
            btn.disabled = false;
        }

        // =========================================================
        // ONGLET 2 : COMBO MICRO-ONDES (600W) -> FOUR
        // =========================================================
        let ovenItems = [
            { id: 'frites', label: 'Frites', temp: 180, time: 20, crispy: true, selected: true },
            { id: 'colin', label: 'Filet colin', temp: 210, time: 20, crispy: false, selected: true },
            { id: 'cabillaud', label: 'Dos cabillaud', temp: 210, time: 28, crispy: false, selected: true },
            { id: 'saumon_f', label: 'Pavé saumon', temp: 200, time: 18, crispy: false, selected: false },
            { id: 'nuggets', label: 'Nuggets', temp: 200, time: 15, crispy: true, selected: false },
            { id: 'gratin', label: 'Gratin', temp: 190, time: 25, crispy: false, selected: false }
        ];

        function renderOvenTab() {
            const chipsEl = document.getElementById('oven-chips');
            chipsEl.innerHTML = '';
            ovenItems.forEach(item => {
                const btn = document.createElement('button');
                btn.className = `chip ${item.selected ? 'selected-amber' : ''}`;
                btn.textContent = item.label;
                btn.onclick = () => {
                    item.selected = !item.selected;
                    if (navigator.vibrate) navigator.vibrate(5);
                    renderOvenTab();
                };
                chipsEl.appendChild(btn);
            });

            const slidersEl = document.getElementById('oven-sliders-container');
            slidersEl.innerHTML = '';
            const active = ovenItems.filter(i => i.selected);

            active.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card halo-blue';
                card.style.padding = '13px 16px';
                card.innerHTML = `
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
                        <span style="font-weight:600; font-size:14px;">${item.label}</span>
                        <button class="ustensil-badge" style="border:none; cursor:pointer; background:${item.crispy ? 'rgba(255,159,10,0.25)' : 'rgba(255,255,255,0.1)'}; color:${item.crispy ? '#ffd699' : '#fff'};" onclick="toggleOvenCrispy('${item.id}')">
                            ${item.crispy ? '🍟 Croustillant (0 MO)' : '💧 Préchauffage 600W OK'}
                        </button>
                    </div>
                    <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px; font-size:12px;">
                        <div>
                            <div style="display:flex; justify-content:space-between; color:var(--text-secondary); margin-bottom:4px;">
                                <span>Temp. paquet</span><strong style="color:#fff;">${item.temp}°C</strong>
                            </div>
                            <input type="range" class="custom-slider" min="160" max="230" step="5" value="${item.temp}" oninput="updateOvenVal('${item.id}', 'temp', this.value)">
                        </div>
                        <div>
                            <div style="display:flex; justify-content:space-between; color:var(--text-secondary); margin-bottom:4px;">
                                <span>Durée paquet</span><strong style="color:#fff;">${item.time} min</strong>
                            </div>
                            <input type="range" class="custom-slider" min="8" max="45" step="1" value="${item.time}" oninput="updateOvenVal('${item.id}', 'time', this.value)">
                        </div>
                    </div>
                `;
                slidersEl.appendChild(card);
            });

            computeOvenPlan(active);
        }

        function toggleOvenCrispy(id) {
            const it = ovenItems.find(i => i.id === id);
            if (it) it.crispy = !it.crispy;
            renderOvenTab();
        }

        function updateOvenVal(id, field, val) {
            const it = ovenItems.find(i => i.id === id);
            if (it) it[field] = parseInt(val, 10);
            renderOvenTab();
        }

        function addOvenCustom() {
            const inp = document.getElementById('oven-new-input');
            const name = inp.value.trim();
            if (!name) return;
            const isCrispy = /frite|pané|nugget|pizza|croustill/i.test(name);
            ovenItems.push({
                id: 'ov_' + Date.now(),
                label: name.substring(0, 16),
                temp: 200,
                time: 22,
                crispy: isCrispy,
                selected: true
            });
            inp.value = '';
            renderOvenTab();
        }

        function computeOvenPlan(active) {
            const resCard = document.getElementById('oven-result-card');
            if (active.length === 0) {
                resCard.classList.add('hidden');
                return;
            }
            resCard.classList.remove('hidden');

            const avgTemp = active.reduce((s, i) => s + i.temp, 0) / active.length;
            const targetTemp = Math.round(avgTemp / 5) * 5;

            const crispyItem = active.find(i => i.crispy);
            let commonMin = 16;
            if (crispyItem) {
                commonMin = Math.round(crispyItem.time * (crispyItem.temp / targetTemp));
            } else {
                const shortest = active.reduce((m, i) => i.time < m.time ? i : m, active[0]);
                commonMin = Math.max(12, Math.round(shortest.time * (shortest.temp / targetTemp) * 0.8));
            }

            document.getElementById('oven-target-temp').textContent = `${targetTemp}°C`;
            document.getElementById('oven-target-time').textContent = `${commonMin} min`;

            const computed = active.map(item => {
                const eqOvenMin = item.time * (item.temp / targetTemp);
                const deficit = eqOvenMin - commonMin;
                if (item.crispy || deficit <= 1.5) {
                    return { ...item, mwSec: 0, note: item.crispy ? "Interdit au micro-ondes (ramollit l'amidon) · Direct au four" : "Directement au four sans préchauffage" };
                }
                const rawSec = Math.round((deficit / 3.2) * 60);
                const mwSec = Math.min(300, Math.max(45, Math.round(rawSec / 15) * 15));
                return {
                    ...item,
                    mwSec,
                    note: mwSec >= 150 ? `À 600 W pendant ${formatMMSS(mwSec)} (retourner à mi-temps)` : `À 600 W pendant ${formatMMSS(mwSec)} sous cloche`
                };
            }).sort((a, b) => b.mwSec - a.mwSec);

            const listEl = document.getElementById('oven-steps-list');
            listEl.innerHTML = computed.map((c, idx) => `
                <div class="step-card">
                    <div class="step-top">
                        <span class="step-time">${idx + 1}. ${c.label}</span>
                        <span class="ustensil-badge" style="color:${c.mwSec > 0 ? '#4cd964' : 'var(--text-secondary)'};">
                            ${c.mwSec > 0 ? `MO 600W : ${formatMMSS(c.mwSec)}` : '00:00 MO'}
                        </span>
                    </div>
                    <div class="step-desc">${c.note}, puis enfourner ${commonMin} min à ${targetTemp}°C.</div>
                </div>
            `).join('');
        }

        // =========================================================
        // ONGLET 3 : OEUF PARFAIT
        // =========================================================
        const eggStates = [
            { id: 'coque', label: '🥄 Coque', times: { S: 165, M: 185, L: 205, XL: 225 }, tip: "Eau frémissante. Écaler le chapeau immédiatement." },
            { id: 'mollet', label: '🟠 Mollet', times: { S: 330, M: 365, L: 395, XL: 425 }, tip: "Eau bouillante, puis plonger 2 min dans l'eau glacée avant d'écaler." },
            { id: 'confit', label: '🍜 Mi-cuit', times: { S: 420, M: 455, L: 490, XL: 525 }, tip: "Jaune confit crémeux qui ne coule pas (parfait avec pâtes ou riz)." },
            { id: 'dur', label: '⚪ Dur', times: { S: 540, M: 585, L: 630, XL: 675 }, tip: "Eau frémissante, refroidir aussitôt à l'eau froide." },
            { id: 'plat', label: '🍳 Au plat', times: { S: 180, M: 195, L: 210, XL: 225 }, tip: "Poêle à feu doux-moyen, saler uniquement le blanc." }
        ];

        let curEggState = 'mollet';
        let curEggSize = 'M';
        let curEggOrigin = 'frigo';
        let curEggCount = 2;
        let eggRemainSec = 365;
        let eggRunning = false;
        let eggInterval = null;

        function computeEggTarget() {
            const st = eggStates.find(s => s.id === curEggState);
            let sec = st.times[curEggSize];
            if (curEggOrigin === 'ambiant') sec -= 25;
            if (curEggCount > 2 && curEggState !== 'plat') sec += (curEggCount - 2) * 8;
            return Math.max(90, sec);
        }

        function renderEggTab() {
            const container = document.getElementById('egg-state-chips');
            container.innerHTML = '';
            eggStates.forEach(st => {
                const btn = document.createElement('button');
                btn.className = `chip ${curEggState === st.id ? 'selected' : ''}`;
                btn.textContent = st.label;
                btn.onclick = () => {
                    curEggState = st.id;
                    resetEggTimer();
                    renderEggTab();
                };
                container.appendChild(btn);
            });

            const stObj = eggStates.find(s => s.id === curEggState);
            document.getElementById('egg-result-title').textContent = stObj.label;
            document.getElementById('egg-tip-text').textContent = stObj.tip;
            if (!eggRunning) {
                eggRemainSec = computeEggTarget();
                document.getElementById('egg-timer-display').textContent = formatMMSS(eggRemainSec);
            }
        }

        function setEggSize(sz) {
            curEggSize = sz;
            ['S', 'M', 'L', 'XL'].forEach(s => document.getElementById(`egg-sz-${s}`).classList.toggle('active', s === sz));
            resetEggTimer();
            renderEggTab();
        }

        function setEggOrigin(orig) {
            curEggOrigin = orig;
            document.getElementById('egg-orig-frigo').classList.toggle('active', orig === 'frigo');
            document.getElementById('egg-orig-ambiant').classList.toggle('active', orig === 'ambiant');
            document.getElementById('egg-temp-label').textContent = orig === 'frigo' ? 'Départ Frigo (4°C)' : 'Départ Ambiant (20°C)';
            resetEggTimer();
            renderEggTab();
        }

        function toggleEggTimer() {
            const btn = document.getElementById('egg-start-btn');
            if (eggRunning) {
                clearInterval(eggInterval);
                eggRunning = false;
                btn.textContent = "▶ Reprendre";
            } else {
                eggRunning = true;
                btn.textContent = "⏸ Pause";
                eggInterval = setInterval(() => {
                    eggRemainSec--;
                    document.getElementById('egg-timer-display').textContent = formatMMSS(eggRemainSec);
                    if (eggRemainSec <= 0) {
                        clearInterval(eggInterval);
                        eggRunning = false;
                        btn.textContent = "✓ Prêt !";
                        playChime(940, 4);
                    }
                }, 1000);
            }
        }

        function resetEggTimer() {
            clearInterval(eggInterval);
            eggRunning = false;
            eggRemainSec = computeEggTarget();
            document.getElementById('egg-timer-display').textContent = formatMMSS(eggRemainSec);
            document.getElementById('egg-start-btn').textContent = "▶ Démarrer Minuteur";
        }

        // =========================================================
        // INITIALISATION AU CHARGEMENT
        // =========================================================
        window.addEventListener('DOMContentLoaded', () => {
            refreshKeyStatus();

            // Crans du curseur Féculents
            const ticksContainer = document.getElementById('starch-ticks');
            for (let i = 3; i <= 15; i++) {
                const t = document.createElement('div');
                t.className = `tick ${i % 3 === 0 ? 'major' : ''}`;
                ticksContainer.appendChild(t);
            }

            const starchSlider = document.getElementById('starch-slider');
            updateRangeFill(starchSlider);
            starchSlider.addEventListener('input', (e) => {
                starchMinutes = parseInt(e.target.value, 10);
                document.getElementById('starch-time-val').textContent = `${starchMinutes} min`;
                updateRangeFill(starchSlider);
                if (navigator.vibrate) navigator.vibrate(5);
                resetSyncTimer();
                buildSyncPlan();
            });

            const eggSlider = document.getElementById('egg-count-slider');
            updateRangeFill(eggSlider);
            eggSlider.addEventListener('input', (e) => {
                curEggCount = parseInt(e.target.value, 10);
                document.getElementById('egg-count-val').textContent = `${curEggCount} œuf${curEggCount > 1 ? 's' : ''}`;
                updateRangeFill(eggSlider);
                if (navigator.vibrate) navigator.vibrate(5);
                resetEggTimer();
            });

            renderSyncChips();
            buildSyncPlan();
            renderOvenTab();
            renderEggTab();
        });
    </script>
</body>
</html>
